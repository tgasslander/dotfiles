general {
    lock_cmd = pidof hyprlock || hyprlock       # avoids running multiple instances
    before_sleep_cmd = loginctl lock-session    # tells systemd to trigger lock before sleeping
}

# This listener fires on IDLE timeout when you step away. It locks the screen
# AND marks the logind session idle, which is required for autosuspend's
# LocalSessionActive check to ever unblock (it never fires this on its own).
listener {
    timeout = 300                               # 5 minutes
    on-timeout = loginctl lock-session && busctl --system call org.freedesktop.login1 /org/freedesktop/login1/session/self org.freedesktop.login1.Session SetIdleHint b true
    on-resume = busctl --system call org.freedesktop.login1 /org/freedesktop/login1/session/self org.freedesktop.login1.Session SetIdleHint b false
}

# Screen has been locked for 30s - turn the monitor off.
listener {
    timeout = 330
    on-timeout = hyprctl dispatch "hl.dsp.dpms('off')"
    # dpms('on') alone can lose a DRM commit race in aquamarine (returns "ok"
    # but the connector stays off) -- see ~/.config/hypr/scripts/dpms-on-retry.sh
    on-resume = ~/.config/hypr/scripts/dpms-on-retry.sh
}
