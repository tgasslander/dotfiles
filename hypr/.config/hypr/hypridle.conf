general {
    lock_cmd = pidof hyprlock || hyprlock       # avoids running multiple instances
    on_lock_cmd = openrgb --config /home/toga/.cache/openrgb-hook -p /home/toga/.config/OpenRGB/profiles/toga-amd-9-night.json   # newer OpenRGB stores profiles as profiles/*.json (not top-level .orp); pass the ABSOLUTE .json path. --config isolates the sizes rewrite-on-exit (a user-context openrgb sees 0 i2c devices and would clobber the real config); the abs -p path still applies the night profile to the root server via autoconnect on :6742. Fires on ANY detected lock.
    before_sleep_cmd = openrgb --config /home/toga/.cache/openrgb-hook -p /home/toga/.config/OpenRGB/profiles/toga-amd-9-night.json; loginctl lock-session   # dim RGB (isolated config, abs .json path, see above), then tell systemd to trigger lock before sleeping
    on_unlock_cmd = openrgb --config /home/toga/.cache/openrgb-hook -p /home/toga/.config/OpenRGB/profiles/toga-amd-9.json   # restore the day profile on unlock (without this, lock dims to night and never comes back)
}

# This listener fires on IDLE timeout when you step away. It locks the screen
# AND marks the logind session idle, which is required for autosuspend's
# LocalSessionActive check to ever unblock (it never fires this on its own).
listener {
    timeout = 300                               # 5 minutes
    # "session/self" isn't a real dbus object path -- only loginctl's CLI
    # resolves that magic string, raw busctl calls fail with "Unknown object".
    # Use $XDG_SESSION_ID (set in hypridle's own environment) instead.
    on-timeout = loginctl lock-session && busctl --system call org.freedesktop.login1 "/org/freedesktop/login1/session/$XDG_SESSION_ID" org.freedesktop.login1.Session SetIdleHint b true
    on-resume = busctl --system call org.freedesktop.login1 "/org/freedesktop/login1/session/$XDG_SESSION_ID" org.freedesktop.login1.Session SetIdleHint b false
}

# Screen has been locked for 30s - turn the monitor off.
# Uses wlopm (wlr-output-power-management-v1) instead of `hyprctl dispatch
# dpms`, which drives DRM directly and was triggering a connector
# teardown/re-enumerate race in aquamarine that made hypridle see a spurious
# "resume" and immediately turn the screen back on.
# wlopm didn't fix that: the monitor drops its link on power-down, the output
# is re-created, and hypridle reports "resumed" ~1s later. dpms-resume.sh
# ignores a resume that close to dpms-off.sh and blanks again. See dpms-off-confirmed-
# working-330s-from-input memory entry for the 2026-08-14 investigation.
listener {
    timeout = 330
    on-timeout = ~/.config/hypr/scripts/dpms-off.sh
    on-resume = ~/.config/hypr/scripts/dpms-resume.sh
}
